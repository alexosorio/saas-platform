# Single-origin para Module Federation:
#  - El HOST (raíz) maneja TODAS las navegaciones (SPA fallback a /index.html).
#  - Los remotes solo aportan archivos estáticos (remoteEntry.js + /assets).
# Así, recargar en /catalog/products carga el HOST, que luego federa el remote.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # remoteEntry.js de cada remote (sin cache agresiva)
    location = /catalog/remoteEntry.js      { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
    location = /subscription/remoteEntry.js { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }

    # Assets de los remotes (hash en el nombre -> cache larga)
    location /catalog/assets/ {
        expires 7d; add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
    location /subscription/assets/ {
        expires 7d; add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Assets del host
    location /assets/ {
        expires 7d; add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Todo lo demás (incluye /catalog/* y /subscription/* de navegación) -> HOST
    location / {
        try_files $uri /index.html;
    }
}
