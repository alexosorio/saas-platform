# Diagnóstico de la conexión GitHub -> AWS (manual): asume el rol de despliegue como lo hacen
# los pipelines y muestra con qué identidad quedó conectado.
name: Diagnóstico AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  conexion:
    name: Conexión con AWS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Identidad
        run: |
          aws sts get-caller-identity --query Arn --output text
          for st in saas-bootstrap saas-base saas-app; do
            echo "== $st: $(aws cloudformation describe-stacks --stack-name $st --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NO_EXISTE)"
            aws cloudformation describe-stack-events --stack-name "$st" \
              --query 'StackEvents[?ends_with(ResourceStatus, `FAILED`) && ResourceStatusReason != `Resource creation cancelled`].[Timestamp, LogicalResourceId, ResourceStatus, ResourceStatusReason]' \
              --output text 2>/dev/null | head -10 || true
          done
      - name: Prueba de la plataforma publicada
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name saas-app \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text 2>/dev/null || true)
          [ -n "$URL" ] && [ "$URL" != "None" ] || { echo "saas-app aún no existe"; exit 0; }
          echo "Plataforma: $URL"
          for p in / /catalog/products /api-usuarios/api/public/config /api-suscripciones/api/public/plans /api-catalogo/actuator/health; do
            code=$(curl -s -o cuerpo.txt -w '%{http_code}' --max-time 30 "$URL$p" || true)
            printf '%-40s %s  %s\n' "$p" "$code" "$(head -c 120 cuerpo.txt | tr '\n' ' ')"
          done
          echo "Servicios ECS:"
          aws ecs describe-services --cluster saas-prod --services user-service catalog-service subscription-service notification-service rabbitmq \
            --query 'services[].[serviceName, runningCount, desiredCount, deployments[0].rolloutState]' --output text
          echo "Destinos del balanceador:"
          for tg in tg-user tg-catalog tg-subs; do
            ARN=$(aws elbv2 describe-target-groups --names $tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null) || continue
            echo "$tg: $(aws elbv2 describe-target-health --target-group-arn $ARN --query 'TargetHealthDescriptions[].TargetHealth.State' --output text 2>/dev/null)"
          done
