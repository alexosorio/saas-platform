# Diagnóstico de la conexión GitHub -> AWS (manual): asume el rol de despliegue como lo hacen
# los pipelines y muestra con qué identidad quedó conectado.
name: Diagnóstico AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  conexion:
    name: Conexión con AWS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Identidad
        run: |
          aws sts get-caller-identity --query Arn --output text
          for st in saas-bootstrap saas-base saas-app; do
            echo "== $st: $(aws cloudformation describe-stacks --stack-name $st --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NO_EXISTE)"
            aws cloudformation describe-stack-events --stack-name "$st" \
              --query 'StackEvents[?ends_with(ResourceStatus, `FAILED`) && ResourceStatusReason != `Resource creation cancelled`].[Timestamp, LogicalResourceId, ResourceStatus, ResourceStatusReason]' \
              --output text 2>/dev/null | head -10 || true
          done
