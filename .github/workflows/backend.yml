# Backends: compila los servicios que cambiaron y, en main, sube sus imágenes y actualiza el stack saas-app.
# - Pull request: solo compila.
# - Push a main: compila, sube la imagen a ECR (etiqueta = commit) y cambia la etiqueta en CloudFormation;
#   ECS reemplaza las tareas sin cortar el servicio y revierte solo si la nueva versión no arranca.
# - Manual (Actions -> Backend -> Run workflow): el servicio que elijas, o los 4.
# Un cambio en libs/ o en el Dockerfile despliega los 4 servicios.
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "libs/**"
      - "services/**"
      - "deploy/docker/Dockerfile.backend"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "libs/**"
      - "services/**"
      - "deploy/docker/Dockerfile.backend"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
    inputs:
      servicio:
        description: Servicio a desplegar
        type: choice
        default: todos
        options: [todos, user-service, catalog-service, subscription-service, notification-service]

permissions:
  contents: read

jobs:
  cambios:
    name: Detectar servicios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # paths-filter lee los archivos del PR
    outputs:
      servicios: ${{ steps.lista.outputs.servicios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            comun:
              - "libs/**"
              - "deploy/docker/Dockerfile.backend"
              - ".github/workflows/backend.yml"
            user-service:
              - "services/user-service/**"
            catalog-service:
              - "services/catalog-service/**"
            subscription-service:
              - "services/subscription-service/**"
            notification-service:
              - "services/notification-service/**"
      - id: lista
        env:
          EVENTO: ${{ github.event_name }}
          ELEGIDO: ${{ inputs.servicio }}
          CAMBIOS: ${{ steps.filtro.outputs.changes || '[]' }}
        run: |
          TODOS='["user-service","catalog-service","subscription-service","notification-service"]'
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            if [ "$ELEGIDO" = "todos" ]; then S="$TODOS"; else S=$(jq -cn --arg s "$ELEGIDO" '[$s]'); fi
          elif echo "$CAMBIOS" | jq -e 'index("comun")' > /dev/null; then
            S="$TODOS"
          else
            S=$(echo "$CAMBIOS" | jq -c '[.[] | select(. != "comun")]')
          fi
          echo "Servicios: $S"
          echo "servicios=$S" >> "$GITHUB_OUTPUT"

  aws:
    name: ¿AWS conectado?
    # Solo en main. Mira si el rol está como variable o como secreto (los secretos no se pueden leer en un "if").
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      listo: ${{ steps.rol.outputs.listo }}
    steps:
      - id: rol
        env:
          ROL: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$ROL" ]; then echo "listo=true" >> "$GITHUB_OUTPUT"
          else echo "listo=false" >> "$GITHUB_OUTPUT"; echo "::notice::Sin AWS_ROLE_ARN: solo se compila."; fi

  compilar:
    name: Compilar ${{ matrix.servicio }}
    needs: cambios
    if: needs.cambios.outputs.servicios != '[]'
    runs-on: ubuntu-latest
    env:
      # Maven Central responde 429 cuando muchos runners descargan a la vez: más reintentos y más espera
      MAVEN_ARGS: >-
        -Daether.connector.http.retryHandler.count=8
        -Daether.connector.http.retryHandler.interval=10000
        -Daether.connector.http.retryHandler.serviceUnavailable=429,503
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJSON(needs.cambios.outputs.servicios) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            libs/*/pom.xml
            services/${{ matrix.servicio }}/pom.xml
      - name: Instalar librerías compartidas
        run: for d in libs/*/; do mvn -B -q -f "$d/pom.xml" -DskipTests install; done
      - name: Compilar y probar
        run: mvn -B -f services/${{ matrix.servicio }}/pom.xml verify

  imagenes:
    name: Imágenes
    needs: [cambios, compilar, aws]
    # Solo en main y cuando AWS ya está conectado (AWS_ROLE_ARN como variable o secreto)
    if: needs.aws.outputs.listo == 'true' && needs.cambios.outputs.servicios != '[]'
    uses: ./.github/workflows/imagenes.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      servicios: ${{ needs.cambios.outputs.servicios }}
      tag: ${{ github.sha }}

  desplegar:
    name: Desplegar (saas-app)
    needs: [cambios, imagenes]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
          # Clave del usuario saas-github-ci (environment production). Si no existe, se usa OIDC.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Nueva etiqueta de imagen en CloudFormation
        env:
          SERVICIOS: ${{ needs.cambios.outputs.servicios }}
          TAG: ${{ github.sha }}
        run: |
          if ! aws cloudformation describe-stacks --stack-name saas-app > /dev/null 2>&1; then
            echo "::notice::El stack saas-app aún no existe: lo crea el pipeline Infraestructura con estas imágenes."
            exit 0
          fi
          ARGS=()
          for s in $(echo "$SERVICIOS" | jq -r '.[]'); do
            case "$s" in
              user-service)         ARGS+=("UserImageTag=$TAG") ;;
              catalog-service)      ARGS+=("CatalogImageTag=$TAG") ;;
              subscription-service) ARGS+=("SubscriptionImageTag=$TAG") ;;
              notification-service) ARGS+=("NotificationImageTag=$TAG") ;;
            esac
          done
          infra/scripts/desplegar-stack.sh app "${ARGS[@]}"
