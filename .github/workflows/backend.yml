# Backends: compila los servicios que cambiaron y, en main, los publica en ECR y actualiza ECS.
# - Pull request: solo compila (sin tocar AWS).
# - Push a main: compila + imagen en ECR + nueva revisión de la task definition + espera a que ECS quede estable.
# - Manual (Actions -> Backend -> Run workflow): despliega el servicio que elijas, o los 4.
# Un cambio en libs/ o en el Dockerfile despliega los 4 servicios.
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "libs/**"
      - "services/**"
      - "deploy/docker/Dockerfile.backend"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "libs/**"
      - "services/**"
      - "deploy/docker/Dockerfile.backend"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
    inputs:
      servicio:
        description: Servicio a desplegar
        type: choice
        default: todos
        options: [todos, user-service, catalog-service, subscription-service, notification-service]

permissions:
  contents: read

# Nunca dos despliegues a la vez sobre la misma rama, y nunca se cancela uno a medias
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cambios:
    name: Detectar servicios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # paths-filter lee los archivos del PR
    outputs:
      servicios: ${{ steps.lista.outputs.servicios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            comun:
              - "libs/**"
              - "deploy/docker/Dockerfile.backend"
              - ".github/workflows/backend.yml"
            user-service:
              - "services/user-service/**"
            catalog-service:
              - "services/catalog-service/**"
            subscription-service:
              - "services/subscription-service/**"
            notification-service:
              - "services/notification-service/**"
      - id: lista
        env:
          EVENTO: ${{ github.event_name }}
          ELEGIDO: ${{ inputs.servicio }}
          CAMBIOS: ${{ steps.filtro.outputs.changes || '[]' }}
        run: |
          TODOS='["user-service","catalog-service","subscription-service","notification-service"]'
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            if [ "$ELEGIDO" = "todos" ]; then S="$TODOS"; else S=$(jq -cn --arg s "$ELEGIDO" '[$s]'); fi
          elif echo "$CAMBIOS" | jq -e 'index("comun")' > /dev/null; then
            S="$TODOS"
          else
            S=$(echo "$CAMBIOS" | jq -c '[.[] | select(. != "comun")]')
          fi
          echo "Servicios: $S"
          echo "servicios=$S" >> "$GITHUB_OUTPUT"

  compilar:
    name: Compilar ${{ matrix.servicio }}
    needs: cambios
    if: needs.cambios.outputs.servicios != '[]'
    runs-on: ubuntu-latest
    env:
      # Maven Central responde 429 cuando muchos runners descargan a la vez: más reintentos y más espera
      MAVEN_ARGS: >-
        -Daether.connector.http.retryHandler.count=8
        -Daether.connector.http.retryHandler.interval=10000
        -Daether.connector.http.retryHandler.serviceUnavailable=429,503
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJSON(needs.cambios.outputs.servicios) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            libs/*/pom.xml
            services/${{ matrix.servicio }}/pom.xml
      - name: Instalar librerías compartidas
        run: for d in libs/*/; do mvn -B -q -f "$d/pom.xml" -DskipTests install; done
      - name: Compilar y probar
        run: mvn -B -f services/${{ matrix.servicio }}/pom.xml verify

  desplegar:
    name: Desplegar ${{ matrix.servicio }}
    needs: [cambios, compilar]
    # Solo en main y cuando AWS ya está conectado (variable AWS_ROLE_ARN definida en GitHub)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && needs.cambios.outputs.servicios != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write          # OIDC: GitHub obtiene credenciales temporales de AWS, sin claves guardadas
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJSON(needs.cambios.outputs.servicios) }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v4

      - name: Imagen en ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          build-args: SERVICE=${{ matrix.servicio }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/saas/${{ matrix.servicio }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

      # Toma la task definition ACTIVA de ECS (variables y secretos incluidos) y solo cambia la imagen
      - name: Nueva revisión de la task definition
        id: td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: saas-${{ matrix.servicio }}
          container-name: app
          image: ${{ steps.ecr.outputs.registry }}/saas/${{ matrix.servicio }}:${{ github.sha }}

      - name: Desplegar en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.td.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ matrix.servicio }}
          wait-for-service-stability: true
          wait-for-minutes: 15
