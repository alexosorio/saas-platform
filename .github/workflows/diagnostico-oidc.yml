# Diagnóstico de la conexión GitHub -> AWS (manual). Muestra los datos del token OIDC (no el token)
# y el error exacto que devuelve AWS al intentar asumir el rol.
name: Diagnóstico OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sin-environment:
    name: Token de la rama main
    runs-on: ubuntu-latest
    steps:
      - name: Datos del token y prueba contra AWS
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+'); while [ $(( ${#P} % 4 )) -ne 0 ]; do P="$P="; done
          echo "Claims del token (sin firma):"
          echo "$P" | base64 -d | jq '{iss, aud, sub, repository, repository_id, repository_owner_id, environment, ref}'
          echo "Rol: $ROLE_ARN  Región: $REGION"
          aws sts assume-role-with-web-identity --region "$REGION" --role-arn "$ROLE_ARN" \
            --role-session-name diagnostico --web-identity-token "$TOKEN" \
            --query 'AssumedRoleUser.Arn' --output text || true

  con-environment:
    name: Token del environment production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Datos del token y prueba contra AWS
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+'); while [ $(( ${#P} % 4 )) -ne 0 ]; do P="$P="; done
          echo "Claims del token (sin firma):"
          echo "$P" | base64 -d | jq '{iss, aud, sub, repository, repository_id, repository_owner_id, environment, ref}'
          echo "Rol: $ROLE_ARN  Región: $REGION"
          aws sts assume-role-with-web-identity --region "$REGION" --role-arn "$ROLE_ARN" \
            --role-session-name diagnostico --web-identity-token "$TOKEN" \
            --query 'AssumedRoleUser.Arn' --output text || true
