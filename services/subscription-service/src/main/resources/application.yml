server:
  port: ${SERVER_PORT:8084}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  application:
    name: subscription-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saas_platform}?currentSchema=gets_shared
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: gets_shared
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:ClaveSecretaCompartidaSaaSPlatform256BitsMinimoParaHS512SeguraYLarga}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.saas.platform.subscription: ${LOG_LEVEL:INFO}

# Vencimientos: avisos previos por correo y bloqueo inmediato al vencer
# (los valores efectivos se configuran en el módulo Configuración: suscripcion.dias_gracia y suscripcion.dias_aviso_vencimiento)
app:
  url: ${APP_URL:http://localhost:3000}          # frontend (enlace "Pagar ahora" de los correos)
  # Orígenes permitidos para CORS, separados por comas. En AWS: CORS_ORIGINS=https://app.tudominio.com
  cors:
    origins: ${CORS_ORIGINS:*}
  suscripciones:
    dias-gracia: ${SUSCRIPCIONES_DIAS_GRACIA:0}   # 0 = bloqueo inmediato
    dias-aviso: ${SUSCRIPCIONES_DIAS_AVISO:7,3,1,0}
    cron-vencimientos: ${SUSCRIPCIONES_CRON:0 5 * * * *}   # cada hora, al minuto 5
    zona: ${SUSCRIPCIONES_ZONA:America/Bogota}
