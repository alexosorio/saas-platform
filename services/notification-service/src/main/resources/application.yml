server:
  port: 8085

spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3

# Correo (SendGrid) — usado por platform-email
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
app:
  # De aquí se toma el logo de cada organización para los correos
  user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
  mail:
    from: ${MAIL_FROM:noreply@tuapp.com}
    from-name: ${MAIL_FROM_NAME:SaaS Platform}
    brand-name: ${APP_MAIL_BRAND_NAME:SaaS Platform}
    brand-color: ${APP_MAIL_BRAND_COLOR:#693a84}
    accent-color: ${APP_MAIL_ACCENT_COLOR:#a871bd}
    footer: ${APP_MAIL_FOOTER:Mensaje automático de SaaS Platform. No respondas a este correo.}

# WhatsApp (Meta Cloud API)
whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  api-version: ${WHATSAPP_API_VERSION:v21.0}
