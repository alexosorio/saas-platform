<!-- Código de recuperación de contraseña. El marco lo pone EmailLayout. -->
<div xmlns:th="http://www.thymeleaf.org">
  <p style="margin:0 0 14px;">Hola <strong th:text="${nombre}">Usuario</strong>,</p>
  <p style="margin:0 0 18px;">Recibimos una solicitud para recuperar tu contraseña. Usa este código de seguridad:</p>
  <div style="border:1px dashed #a871bd;border-radius:8px;padding:16px;text-align:center;margin:0 0 16px;">
    <div style="font-size:30px;font-weight:bold;letter-spacing:6px;color:#693a84;" th:text="${codigo}">123456</div>
    <div style="font-size:12px;color:#888;margin-top:6px;">Válido por <span th:text="${validezMinutos}">15</span> minutos.</div>
  </div>
  <p style="margin:0;font-size:13px;color:#666;">Si no solicitaste este cambio, ignora este mensaje: tu contraseña sigue segura.</p>
</div>
