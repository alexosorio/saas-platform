<!-- Aviso de cambio de contraseña. El marco lo pone EmailLayout. -->
<div xmlns:th="http://www.thymeleaf.org">
  <p style="margin:0 0 14px;">Hola <strong th:text="${nombre}">Usuario</strong>,</p>
  <p style="margin:0 0 14px;">Te confirmamos que la contraseña de tu cuenta se cambió correctamente.</p>
  <p style="margin:0;padding:12px 14px;background:#fff4e5;border-left:4px solid #f59e0b;border-radius:4px;font-size:14px;">
    Si <strong>no</strong> hiciste este cambio, recupera tu contraseña de inmediato y avisa al administrador de tu organización.
  </p>
</div>
