# ===================================
# USER SERVICE - CONFIGURACIÓN CQRS
# ===================================

spring:
  application:
    name: user-service
  
  # Base de datos PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saas_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        batch_size: 20
  
  # Thymeleaf para templates de email
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  
  # Jackson
  jackson:
    # Jackson 3 (Spring Boot 4): las fechas ya se serializan como ISO-8601 por defecto,
    # por eso se elimina 'serialization.write-dates-as-timestamps'.
    time-zone: America/Bogota
    default-property-inclusion: non_null
  
  # Async Configuration
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: async-

# Server Configuration
server:
  port: ${SERVER_PORT:8082}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:TuClaveSecretaMuySeguraParaJWTDebeSerDe256BitsOMasParaHS256AlgoritmoDeEncriptacion}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}    # 1 hora
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 días

# Email settings (SendGrid vía módulo compartido platform-email)
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
app:
  url: ${APP_URL:http://localhost:3000}   # dirección del frontend (enlaces de los correos)
  # Orígenes permitidos para CORS, separados por comas. En AWS: CORS_ORIGINS=https://app.tudominio.com
  cors:
    origins: ${CORS_ORIGINS:*}
  mail:
    from: ${MAIL_FROM:noreply@tuapp.com}
    from-name: ${MAIL_FROM_NAME:SaaS Platform}
    brand-name: ${APP_MAIL_BRAND_NAME:SaaS Platform}
    brand-color: ${APP_MAIL_BRAND_COLOR:#693a84}
    accent-color: ${APP_MAIL_ACCENT_COLOR:#a871bd}
    footer: ${APP_MAIL_FOOTER:Mensaje automático de SaaS Platform. No respondas a este correo.}

# Eureka Discovery (opcional)
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

# Services URLs
services:
  authorization:
    url: ${AUTHORIZATION_SERVICE_URL:http://localhost:8084}
    token: ${SERVICE_ACCOUNT_TOKEN:}  # Token para autenticación entre microservicios

# Logging
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.saas.platform: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_BIND_LOG_LEVEL:INFO}
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# CQRS Configuration
cqrs:
  async-commands: ${ASYNC_COMMANDS:true}
  event-store:
    enabled: ${EVENT_STORE_ENABLED:false}
