server:
  port: ${SERVER_PORT:8083}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saas_platform}?currentSchema=gets_shared
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # La base de datos YA EXISTE (schema gets_shared). 'none' evita que Hibernate
      # cree, altere o VALIDE el esquema. Se usa 'none' (no 'validate') porque el
      # driver JDBC de PostgreSQL reporta las columnas ENUM nativas como VARCHAR,
      # lo que hace que la schema-validation de Hibernate falle al compararlas con
      # el tipo NAMED_ENUM. La lectura/escritura en runtime SI funciona bien.
      ddl-auto: none
    properties:
      hibernate:
        default_schema: gets_shared
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

jwt:
  # DEBE ser el MISMO secret que usa el user-service (puerto 8082) para que
  # los tokens emitidos por user-service sean validos aqui.
  secret: ${JWT_SECRET:ClaveSecretaCompartidaSaaSPlatform256BitsMinimoParaHS512SeguraYLarga}

app:
  # Orígenes permitidos para CORS, separados por comas. En AWS: CORS_ORIGINS=https://app.tudominio.com
  cors:
    origins: ${CORS_ORIGINS:*}

  # Plazo por defecto (días) para vencimiento de cuentas por pagar / cobrar
  cuentas:
    plazo-pagar-dias: ${CUENTAS_PLAZO_PAGAR_DIAS:30}
    plazo-cobrar-dias: ${CUENTAS_PLAZO_COBRAR_DIAS:30}
  # URL base del frontend que sirve la vista publica de listas.
  # Con el reverse proxy unificador (platform-proxy en :3000), el catalogo
  # se sirve bajo /catalog, asi que las URLs publicas seran:
  #   http://localhost:3000/catalog/public/list/{token}
  # En produccion: https://tu-dominio.com/catalog/public/list/{token}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000/catalog}

  # Directorio local donde se guardan las imagenes subidas.
  # Servidas en /uploads/** por el WebConfig.
  uploads:
    dir: ${UPLOADS_DIR:./uploads}

  # Remitente de los correos (SendGrid)
  mail:
    from: ${MAIL_FROM:noreply@tuapp.com}
    from-name: ${MAIL_FROM_NAME:Catálogo}

# SendGrid (mismo proveedor que el modulo de autenticacion)
sendgrid:
  api-key: ${SENDGRID_API_KEY:}

# WhatsApp Cloud API (Meta). Para iniciar conversaciones se requiere
# una plantilla aprobada; el texto libre solo funciona dentro de la ventana de 24h.
whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  api-version: ${WHATSAPP_API_VERSION:v21.0}

# Tamano maximo de archivo subido (imagen de producto)
spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.saas.platform.catalog: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
